[project]
name = "recon-agent-hub-backend"
version = "0.1.0"
description = "Backend do recon-agent-hub: orquestracao de recon + triagem de achados por IA."
authors = [
    { name = "joao tapparo", email = "joaovtapparo@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "google-genai>=0.3",
    "python-dotenv>=1.0",
    "dnspython>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[tool.uv]
package = false
